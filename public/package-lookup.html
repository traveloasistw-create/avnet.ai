<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 异常包裹查询工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-box button {
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .results-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-height: 200px;
        }

        .result-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .waybill-number {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .result-field {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .result-label {
            font-size: 0.9em;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .duration {
            background: #fff3e0;
            border-left: 4px solid #FF9800;
        }

        .duration .result-value {
            color: #e65100;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f44336;
            margin-bottom: 20px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4caf50;
            margin-bottom: 20px;
        }

        .help-text {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #1565c0;
        }

        .multiple-results {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #6a1b9a;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .search-box {
                flex-direction: column;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            .search-card {
                padding: 20px;
            }

            .results-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 异常包裹查询工具</h1>
            <p>快速查询TW寄件号的包货时间</p>
        </header>

        <div class="search-card">
            <div class="help-text">
                💡 输入TW编号后，系统会显示这个包裹的所有扫码时间
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="waybillInput"
                    placeholder="例如: tw2627552652668z"
                    autofocus
                >
                <button onclick="queryWaybill()">查询</button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <script>
        const STORAGE_KEY = 'packageScannerData';

        // 获取所有记录
        function getAllRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 格式化时间
        function formatTime(dateString) {
            const date = new Date(dateString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekDay = weekDays[date.getDay()];
            return `${month}月${day}日 (礼拜${weekDay})`;
        }

        // 格式化耗时
        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}分${secs}秒`;
        }

        // 查询
        function queryWaybill() {
            const waybill = document.getElementById('waybillInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('resultsContainer');

            if (!waybill) {
                resultsDiv.innerHTML = `
                    <div class="error-message">
                        ❌ 请输入TW编号
                    </div>
                `;
                return;
            }

            const allRecords = getAllRecords();
            const matchingRecords = allRecords.filter(r => r.waybill.toLowerCase() === waybill);

            if (matchingRecords.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>没有找到这个寄件号</p>
                        <p style="font-size: 0.9em; color: #ccc;">请检查编号是否正确</p>
                    </div>
                `;
                return;
            }

            // 配对开始和完成
            const pairs = [];
            const startRecords = matchingRecords.filter(r => r.status === 'start');
            const completeRecords = matchingRecords.filter(r => r.status === 'complete');

            // 按时间排序
            startRecords.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            completeRecords.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            // 配对逻辑：相邻的start和complete配对
            for (let i = 0; i < startRecords.length; i++) {
                const startTime = new Date(startRecords[i].timestamp);

                // 找到这个start之后最近的complete
                let matchingComplete = null;
                for (let j = 0; j < completeRecords.length; j++) {
                    const completeTime = new Date(completeRecords[j].timestamp);
                    if (completeTime > startTime) {
                        matchingComplete = completeRecords[j];
                        completeRecords.splice(j, 1); // 移除已使用的
                        break;
                    }
                }

                if (matchingComplete) {
                    const completeTime = new Date(matchingComplete.timestamp);
                    const duration = (completeTime - startTime) / 1000;

                    pairs.push({
                        startTime: startTime,
                        completeTime: completeTime,
                        duration: duration,
                        startDisplay: formatTime(startRecords[i].timestamp),
                        completeDisplay: formatTime(matchingComplete.timestamp),
                        dateDisplay: formatDate(startRecords[i].timestamp),
                        durationDisplay: formatDuration(duration)
                    });
                } else {
                    // 没有对应的complete，只显示start
                    pairs.push({
                        startTime: startTime,
                        completeTime: null,
                        duration: null,
                        startDisplay: formatTime(startRecords[i].timestamp),
                        completeDisplay: '-',
                        dateDisplay: formatDate(startRecords[i].timestamp),
                        durationDisplay: '进行中'
                    });
                }
            }

            // 显示结果
            let html = '';

            if (pairs.length > 1) {
                html += `
                    <div class="multiple-results">
                        ⚠️ 这个寄件号有 ${pairs.length} 条记录（可能重复扫了或出了问题）
                    </div>
                `;
            }

            pairs.forEach((pair, index) => {
                html += `
                    <div class="result-item">
                        <div class="waybill-number">
                            TW编号：${waybill.toUpperCase()}
                            ${pairs.length > 1 ? `<span style="font-size: 0.7em; color: #999; margin-left: 10px;">记录 ${index + 1}</span>` : ''}
                        </div>
                        <div class="result-grid">
                            <div class="result-field">
                                <div class="result-label">📅 日期</div>
                                <div class="result-value">${pair.dateDisplay}</div>
                            </div>
                            <div class="result-field">
                                <div class="result-label">⏱️ 开始时间</div>
                                <div class="result-value">${pair.startDisplay}</div>
                            </div>
                            <div class="result-field">
                                <div class="result-label">✓ 完成时间</div>
                                <div class="result-value">${pair.completeDisplay}</div>
                            </div>
                            <div class="result-field duration">
                                <div class="result-label">⏳ 包货耗时</div>
                                <div class="result-value">${pair.durationDisplay}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        // 回车查询
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('waybillInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    queryWaybill();
                }
            });
        });
    </script>
</body>
</html>
