<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 包货管理系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lang-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid transparent;
            background: #f5f5f5;
            color: #666;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #efefef;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-complete {
            background: #2196F3;
            color: white;
        }

        .btn-complete:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-export {
            background: #FF9800;
            color: white;
        }

        .btn-export:hover {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-search {
            background: #667eea;
            color: white;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-clear:hover {
            background: #da190b;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .records-container {
            grid-column: 1 / -1;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table thead {
            background: #f5f5f5;
            position: sticky;
            top: 0;
        }

        table th {
            padding: 12px;
            text-align: left;
            color: #555;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .status-start {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-complete {
            background: #bbdefb;
            color: #1565c0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .success-message {
            background: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box button {
            padding: 12px 20px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #1565c0;
        }

        .result-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .waybill-number {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .result-field {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .result-label {
            font-size: 0.9em;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .duration {
            background: #fff3e0;
            border-left: 4px solid #FF9800;
        }

        .duration .result-value {
            color: #e65100;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f44336;
            margin-bottom: 20px;
        }

        .multiple-results {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #6a1b9a;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .records-container {
                grid-column: 1;
            }

            header h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-direction: column;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="language-switch">
        <button class="lang-btn active" onclick="setLanguage('zh-TW')">繁體中文</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="title">📦 包货管理系统</h1>
            <p data-i18n="subtitle">扫码输入 + 异常查询 | 电脑 + 手机通用</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('input')" data-i18n="scanTab">
                📥 掃碼輸入系統
            </button>
            <button class="tab-button" onclick="switchTab('lookup')" data-i18n="lookupTab">
                🔍 異常查詢系統
            </button>
        </div>

        <!-- 标签页1：扫码输入系统 -->
        <div id="input-tab" class="tab-content active">
            <div class="main-grid">
                <div class="card">
                    <h2 data-i18n="scanInput">🔍 掃碼輸入</h2>

                    <div class="info-box" data-i18n="scanTip">
                        💡 掃碼槍掃QR碼 → 自動記錄寄件號和時間
                    </div>

                    <div id="successMessage"></div>

                    <div class="input-group">
                        <label for="waybillNumber" data-i18n="trackingLabel">寄件編號 (Tracking Number)</label>
                        <input type="text" id="waybillNumber" data-placeholder="trackingPlaceholder" placeholder="例如: tw2627552652668z" autofocus>
                    </div>

                    <div class="input-group">
                        <label for="status" data-i18n="statusLabel">包貨狀態</label>
                        <select id="status">
                            <option value="" data-i18n="statusSelect">-- 選擇狀態 --</option>
                            <option value="start" data-i18n="statusStart">📍 開始包貨</option>
                            <option value="complete" data-i18n="statusComplete">✓ 完成包貨</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button class="btn-start" onclick="recordStart()" data-i18n="btnStart">開始 (F1)</button>
                        <button class="btn-complete" onclick="recordComplete()" data-i18n="btnComplete">完成 (F2)</button>
                    </div>

                    <div class="stats">
                        <div class="stat-box">
                            <div class="number" id="totalRecords">0</div>
                            <div class="label" data-i18n="totalRecords">總掃描次數</div>
                        </div>
                        <div class="stat-box">
                            <div class="number" id="pairsCount">0</div>
                            <div class="label" data-i18n="pairsCount">完成對數</div>
                        </div>
                    </div>

                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                        <button class="btn-export" onclick="exportToExcel()" style="width: 100%; margin-bottom: 10px;" data-i18n="exportBtn">
                            📥 導出 Excel
                        </button>
                        <button class="btn-clear" onclick="clearAllData()" style="width: 100%;" data-i18n="clearBtn">
                            🗑️ 清空所有資料
                        </button>
                    </div>
                </div>

                <div class="card">
                    <h2 data-i18n="quickStats">📊 快速統計</h2>

                    <div style="margin-bottom: 15px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                        <div style="margin-bottom: 10px;">
                            <strong data-i18n="todayData">📈 今日資料</strong>
                        </div>
                        <div style="font-size: 0.95em; color: #666; line-height: 1.8;">
                            <div><span data-i18n="started">已開始</span>: <span id="startCount">0</span> 件</div>
                            <div><span data-i18n="completed">已完成</span>: <span id="completeCount">0</span> 件</div>
                            <div><span data-i18n="avgDuration">平均耗時</span>: <span id="avgDuration">-</span></div>
                            <div><span data-i18n="maxDuration">最長耗時</span>: <span id="maxDuration">-</span></div>
                            <div><span data-i18n="minDuration">最短耗時</span>: <span id="minDuration">-</span></div>
                        </div>
                    </div>

                    <div style="margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #FF9800;">
                        <strong style="color: #e65100;" data-i18n="shortcuts">⚡ 快捷鍵</strong>
                        <div style="font-size: 0.9em; color: #666; margin-top: 10px; line-height: 1.8;">
                            <div><code>F1</code> = <span data-i18n="statusStart">📍 開始包貨</span></div>
                            <div><code>F2</code> = <span data-i18n="statusComplete">✓ 完成包貨</span></div>
                            <div><code>Ctrl+E</code> = <span data-i18n="exportBtn">📥 導出 Excel</span></div>
                        </div>
                    </div>
                </div>

                <div class="card records-container">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="margin: 0;" data-i18n="recordsTable">📋 掃碼記錄</h2>
                        <span style="color: #999; font-size: 0.9em;" id="recordCount">共 0 條記錄</span>
                    </div>

                    <div id="recordsTable"></div>
                </div>
            </div>
        </div>

        <!-- 标签页2：异常查询系统 -->
        <div id="lookup-tab" class="tab-content">
            <div class="card">
                <h2 data-i18n="queryTitle">🔍 異常包裹查詢</h2>

                <div class="info-box" data-i18n="queryTip">
                    💡 輸入TW編號後，系統會顯示這個包裹的所有掃碼時間
                </div>

                <div class="search-box">
                    <input
                        type="text"
                        id="waybillInput"
                        data-placeholder="trackingPlaceholder"
                        placeholder="例如: tw2627552652668z"
                    >
                    <button class="btn-search" onclick="queryWaybill()" data-i18n="searchBtn">查詢</button>
                </div>

                <div id="resultsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'packageScannerData';
        let currentLanguage = localStorage.getItem('appLanguage') || 'zh-TW';

        const translations = {

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('appLanguage', lang);
            updatePageLanguage();
            updatePlaceholders();

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function t(key) {
            return translations[currentLanguage][key] || translations['zh-TW'][key];
        }

        function updatePageLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'input') {
                setTimeout(() => document.getElementById('waybillNumber').focus(), 100);
            } else {
                setTimeout(() => document.getElementById('waybillInput').focus(), 100);
            }
        }

        function getAllRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            loadAndDisplayRecords();
        }

        function addRecord(waybill, status) {
            const records = getAllRecords();
            const timestamp = new Date();

            records.push({
                id: Date.now(),
                waybill: waybill.trim(),
                status: status,
                timestamp: timestamp.toISOString(),
                timeDisplay: formatTime(timestamp)
            });

            saveRecords(records);
            const statusText = status === 'start' ? t('statusStart') : t('statusComplete');
            showSuccessMessage(`${t('recordedMsg')}: ${waybill} (${statusText})`);
            clearInput();
        }

        function clearInput() {
            document.getElementById('waybillNumber').value = '';
            document.getElementById('status').value = '';
            document.getElementById('waybillNumber').focus();
        }

        function formatTime(date) {
            if (!(date instanceof Date)) {
                date = new Date(date);
            }
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            if (currentLanguage === 'en') {
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                return `${monthNames[date.getMonth()]} ${day} (${dayNames[date.getDay()]})`;
            } else {
                const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                const weekDay = weekDays[date.getDay()];
                return `${month}月${day}日 (星期${weekDay})`;
            }
        }

        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            if (currentLanguage === 'en') {
                return `${minutes}m ${secs}s`;
            } else {
                return `${minutes}分${secs}秒`;
            }
        }

        function recordStart() {
            const waybill = document.getElementById('waybillNumber').value.trim();
            if (!waybill) {
                alert(t('pleaseInput'));
                return;
            }
            addRecord(waybill, 'start');
        }

        function recordComplete() {
            const waybill = document.getElementById('waybillNumber').value.trim();
            if (!waybill) {
                alert(t('pleaseInput'));
                return;
            }
            addRecord(waybill, 'complete');
        }

        function showSuccessMessage(msg) {
            const msgDiv = document.getElementById('successMessage');
            msgDiv.innerHTML = `<div class="success-message">${msg}</div>`;
            setTimeout(() => {
                msgDiv.innerHTML = '';
            }, 3000);
        }

        function calculatePairs() {
            const records = getAllRecords();
            const pairs = [];
            const waybillMap = {};

            records.forEach(record => {
                if (!waybillMap[record.waybill]) {
                    waybillMap[record.waybill] = [];
                }
                waybillMap[record.waybill].push(record);
            });

            Object.keys(waybillMap).forEach(waybill => {
                const events = waybillMap[waybill];
                for (let i = 0; i < events.length - 1; i++) {
                    if (events[i].status === 'start' && events[i + 1].status === 'complete') {
                        const startTime = new Date(events[i].timestamp);
                        const completeTime = new Date(events[i + 1].timestamp);
                        const duration = (completeTime - startTime) / 1000;

                        pairs.push({
                            waybill: waybill,
                            startTime: startTime,
                            completeTime: completeTime,
                            duration: duration,
                            startDisplay: formatTime(events[i].timestamp),
                            completeDisplay: formatTime(events[i + 1].timestamp),
                            durationDisplay: formatDuration(duration)
                        });
                        i++;
                    }
                }
            });

            return pairs;
        }

        function loadAndDisplayRecords() {
            const records = getAllRecords();
            const pairs = calculatePairs();

            updateStats(records, pairs);
            displayRecordsTable(records);
        }

        function updateStats(records, pairs) {
            const startCount = records.filter(r => r.status === 'start').length;
            const completeCount = records.filter(r => r.status === 'complete').length;

            document.getElementById('totalRecords').textContent = records.length;
            document.getElementById('pairsCount').textContent = pairs.length;
            document.getElementById('startCount').textContent = startCount;
            document.getElementById('completeCount').textContent = completeCount;

            if (pairs.length > 0) {
                const durations = pairs.map(p => p.duration);
                const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
                const maxDuration = Math.max(...durations);
                const minDuration = Math.min(...durations);

                document.getElementById('avgDuration').textContent = formatDuration(avgDuration);
                document.getElementById('maxDuration').textContent = formatDuration(maxDuration);
                document.getElementById('minDuration').textContent = formatDuration(minDuration);
            }
        }

        function displayRecordsTable(records) {
            const tableDiv = document.getElementById('recordsTable');
            document.getElementById('recordCount').textContent = `${t('recordCount')} ${records.length} ${t('recordsCount')}`;

            if (records.length === 0) {
                tableDiv.innerHTML = `<div class="empty-state"><p>${t('emptyRecords')}</p></div>`;
                return;
            }

            let html = '<table>';
            html += '<thead><tr>';
            html += `<th>${t('waybillCol')}</th>`;
            html += `<th>${t('statusCol')}</th>`;
            html += `<th>${t('timeCol')}</th>`;
            html += `<th>${t('actionCol')}</th>`;
            html += '</tr></thead><tbody>';

            const recordsReversed = [...records].reverse();
            recordsReversed.forEach(record => {
                const statusDisplay = record.status === 'start'
                    ? `<span class="status-start">${t('statusStartCol')}</span>`
                    : `<span class="status-complete">${t('statusCompleteCol')}</span>`;
                html += `<tr>`;
                html += `<td><code>${record.waybill}</code></td>`;
                html += `<td>${statusDisplay}</td>`;
                html += `<td>${record.timeDisplay}</td>`;
                html += `<td><button class="btn-delete" onclick="deleteRecord(${record.id})">${t('deleteBtn')}</button></td>`;
                html += `</tr>`;
            });

            html += '</tbody></table>';
            tableDiv.innerHTML = html;
        }

        function deleteRecord(id) {
            if (confirm(t('confirmDelete'))) {
                const records = getAllRecords();
                const filtered = records.filter(r => r.id !== id);
                saveRecords(filtered);
            }
        }

        function exportToExcel() {
            const pairs = calculatePairs();

            if (pairs.length === 0) {
                alert(t('exportError'));
                return;
            }

            const headerRow = currentLanguage === 'en'
                ? ['Tracking #', 'Start Time', 'Complete Time', 'Duration (Min:Sec)', 'Duration (Sec)']
                : ['寄件編號', '開始時間', '完成時間', '耗時(分秒)', '耗時(秒)'];

            const data = [
                headerRow,
                ...pairs.map(p => [
                    p.waybill,
                    p.startDisplay,
                    p.completeDisplay,
                    p.durationDisplay,
                    Math.round(p.duration)
                ])
            ];

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            const sheetName = currentLanguage === 'en' ? 'Packing Records' : '包貨記錄';
            XLSX.utils.book_append_sheet(wb, ws, sheetName);

            ws['!cols'] = [
                { wch: 20 },
                { wch: 15 },
                { wch: 15 },
                { wch: 12 },
                { wch: 10 }
            ];

            const fileName = currentLanguage === 'en'
                ? `packing_records_${new Date().toISOString().split('T')[0]}.xlsx`
                : `包貨記錄_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);

            showSuccessMessage(`${t('exportSuccess')} ${pairs.length} ${t('exportNotice')}`);
        }

        function clearAllData() {
            if (confirm(t('confirmClear'))) {
                if (confirm(t('confirmClear2'))) {
                    localStorage.removeItem(STORAGE_KEY);
                    loadAndDisplayRecords();
                    showSuccessMessage(t('clearSuccess'));
                }
            }
        }

        function queryWaybill() {
            const waybill = document.getElementById('waybillInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('resultsContainer');

            if (!waybill) {
                resultsDiv.innerHTML = `
                    <div class="error-message">
                        ${t('inputError')}
                    </div>
                `;
                return;
            }

            const allRecords = getAllRecords();
            const matchingRecords = allRecords.filter(r => r.waybill.toLowerCase() === waybill);

            if (matchingRecords.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3em; margin-bottom: 20px;">${t('notFound')}</div>
                        <p>${t('notFoundMsg')}</p>
                        <p style="font-size: 0.9em; color: #ccc;">${t('notFoundTip')}</p>
                    </div>
                `;
                return;
            }

            const pairs = [];
            const startRecords = matchingRecords.filter(r => r.status === 'start');
            const completeRecords = matchingRecords.filter(r => r.status === 'complete');

            startRecords.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            completeRecords.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            for (let i = 0; i < startRecords.length; i++) {
                const startTime = new Date(startRecords[i].timestamp);

                let matchingComplete = null;
                for (let j = 0; j < completeRecords.length; j++) {
                    const completeTime = new Date(completeRecords[j].timestamp);
                    if (completeTime > startTime) {
                        matchingComplete = completeRecords[j];
                        completeRecords.splice(j, 1);
                        break;
                    }
                }

                if (matchingComplete) {
                    const completeTime = new Date(matchingComplete.timestamp);
                    const duration = (completeTime - startTime) / 1000;

                    pairs.push({
                        startTime: startTime,
                        completeTime: completeTime,
                        duration: duration,
                        startDisplay: formatTime(startRecords[i].timestamp),
                        completeDisplay: formatTime(matchingComplete.timestamp),
                        dateDisplay: formatDate(startRecords[i].timestamp),
                        durationDisplay: formatDuration(duration)
                    });
                } else {
                    pairs.push({
                        startTime: startTime,
                        completeTime: null,
                        duration: null,
                        startDisplay: formatTime(startRecords[i].timestamp),
                        completeDisplay: '-',
                        dateDisplay: formatDate(startRecords[i].timestamp),
                        durationDisplay: t('onGoing')
                    });
                }
            }

            let html = '';

            if (pairs.length > 1) {
                html += `
                    <div class="multiple-results">
                        ${t('multipleRecords')} ${pairs.length} ${t('multipleRecordsTip')}
                    </div>
                `;
            }

            pairs.forEach((pair, index) => {
                html += `
                    <div class="result-item">
                        <div class="waybill-number">
                            TW: ${waybill.toUpperCase()}
                            ${pairs.length > 1 ? `<span style="font-size: 0.7em; color: #999; margin-left: 10px;">${t('recordNum')} ${index + 1}</span>` : ''}
                        </div>
                        <div class="result-grid">
                            <div class="result-field">
                                <div class="result-label">${t('dateField')}</div>
                                <div class="result-value">${pair.dateDisplay}</div>
                            </div>
                            <div class="result-field">
                                <div class="result-label">${t('startTimeField')}</div>
                                <div class="result-value">${pair.startDisplay}</div>
                            </div>
                            <div class="result-field">
                                <div class="result-label">${t('completeTimeField')}</div>
                                <div class="result-value">${pair.completeDisplay}</div>
                            </div>
                            <div class="result-field duration">
                                <div class="result-label">${t('durationField')}</div>
                                <div class="result-value">${pair.durationDisplay}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function updatePlaceholders() {
            const waybillInput = document.getElementById('waybillNumber');
            const queryInput = document.getElementById('waybillInput');
            if (waybillInput) {
                waybillInput.placeholder = t('trackingPlaceholder');
            }
            if (queryInput) {
                queryInput.placeholder = t('trackingPlaceholder');
            }
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('appLanguage') || 'zh-TW';
            currentLanguage = savedLang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((savedLang === 'zh-TW' && btn.textContent.includes('繁體')) ||
                    (savedLang === 'en' && btn.textContent === 'English')) {
                    btn.classList.add('active');
                }
            });

            updatePageLanguage();
            updatePlaceholders();
        }

        function initApp() {
            initLanguage();
            loadAndDisplayRecords();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'F1') {
                    e.preventDefault();
                    recordStart();
                }
                if (e.key === 'F2') {
                    e.preventDefault();
                    recordComplete();
                }
                if (e.ctrlKey && e.key === 'e') {
                    e.preventDefault();
                    exportToExcel();
                }
            });

            document.getElementById('waybillInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    queryWaybill();
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
