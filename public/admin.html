<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>使用者管理</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a href="/" class="brand-home"><h1>📷 旅遊綠洲 監視器看板</h1></a>
        <nav class="tabs">
          <a href="/">即時</a>
          <a href="/playback.html" id="playbackTab">回放</a>
          <a href="/cameras.html">攝影機</a>
          <a href="/admin.html" class="active">管理</a>
        </nav>
      </div>
      <div class="controls">
        <span id="userLabel" class="user-label"></span>
        <button id="logoutBtn">登出</button>
      </div>
    </header>

    <main class="admin">
      <section class="admin-panel">
        <h2>目前在線 <span id="onlineCount" class="count-badge">0</span></h2>
        <div id="onlineList" class="online-list">
          <p class="user-note">載入中…</p>
        </div>
        <p id="diskInfo" class="user-note"></p>
      </section>

      <section class="admin-panel">
        <h2>通知設定（Telegram 推播）</h2>
        <form id="notifyForm" class="admin-form">
          <label class="chk"><input id="ntgEnabled" type="checkbox" /> 啟用移動偵測推播</label>
          <label>Bot Token <input id="ntgToken" type="text" placeholder="從 @BotFather 取得" /></label>
          <label>Chat ID <input id="ntgChat" type="text" placeholder="你的聊天室 ID" /></label>
          <div class="user-actions">
            <button type="submit">儲存</button>
            <button type="button" id="ntgTest">發送測試訊息</button>
          </div>
          <p id="ntgMsg" class="user-note"></p>
        </form>
      </section>

      <section class="admin-panel">
        <h2>新增同事帳號</h2>
        <form id="addForm" class="admin-form">
          <label>帳號 <input id="newUser" type="text" required /></label>
          <label>密碼 <input id="newPass" type="text" required /></label>
          <label class="chk">
            <input id="newAdmin" type="checkbox" /> 設為管理員（可看全部、可管理帳號）
          </label>
          <div class="cam-picker" id="newCams"></div>
          <button type="submit">新增</button>
          <p id="addErr" class="login-err hidden"></p>
        </form>
      </section>

      <section class="admin-panel">
        <h2>現有帳號 <span id="userCount" class="count-badge">0</span></h2>
        <div id="userList" class="user-list"></div>
      </section>

      <section class="admin-panel">
        <h2>操作日誌</h2>
        <div id="logList" class="log-list">
          <p class="user-note">載入中…</p>
        </div>
      </section>
    </main>

    <script src="/harden.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
