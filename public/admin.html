<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>使用者管理</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>📷 監視器看板</h1>
        <nav class="tabs">
          <a href="/">即時</a>
          <a href="/playback.html" id="playbackTab">回放</a>
          <a href="/admin.html" class="active">管理</a>
        </nav>
      </div>
      <div class="controls">
        <span id="userLabel" class="user-label"></span>
        <button id="logoutBtn">登出</button>
      </div>
    </header>

    <main class="admin">
      <section class="admin-panel">
        <h2>目前在線 <span id="onlineCount" class="count-badge">0</span></h2>
        <div id="onlineList" class="online-list">
          <p class="user-note">載入中…</p>
        </div>
        <p id="diskInfo" class="user-note"></p>
      </section>

      <section class="admin-panel">
        <h2>攝影機管理</h2>
        <form id="addCamForm" class="admin-form">
          <label>名稱 <input id="camName" type="text" placeholder="例如：大門" required /></label>
          <label>
            RTSP 網址
            <input id="camUrl" type="text" placeholder="rtsp://帳號:密碼@192.168.x.x:554/..." required />
          </label>
          <label class="chk" id="camRecordLabel"><input id="camRecord" type="checkbox" checked /> 同時錄影存檔</label>
          <button type="submit">➕ 新增攝影機</button>
          <p id="addCamErr" class="login-err hidden"></p>
        </form>
        <div id="camList" class="user-list"></div>
      </section>

      <section class="admin-panel">
        <h2>新增同事帳號</h2>
        <form id="addForm" class="admin-form">
          <label>帳號 <input id="newUser" type="text" required /></label>
          <label>密碼 <input id="newPass" type="text" required /></label>
          <label class="chk">
            <input id="newAdmin" type="checkbox" /> 設為管理員（可看全部、可管理帳號）
          </label>
          <div class="cam-picker" id="newCams"></div>
          <button type="submit">新增</button>
          <p id="addErr" class="login-err hidden"></p>
        </form>
      </section>

      <section class="admin-panel">
        <h2>現有帳號 <span id="userCount" class="count-badge">0</span></h2>
        <div id="userList" class="user-list"></div>
      </section>

      <section class="admin-panel">
        <h2>操作日誌</h2>
        <div id="logList" class="log-list">
          <p class="user-note">載入中…</p>
        </div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
