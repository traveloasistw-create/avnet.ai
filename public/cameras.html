<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>攝影機管理</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a href="/" class="brand-home"><h1>📷 旅遊綠洲 監視器看板</h1></a>
        <nav class="tabs">
          <a href="/">即時</a>
          <a href="/playback.html" id="playbackTab">回放</a>
          <a href="/cameras.html" class="active">攝影機</a>
          <a href="/admin.html" id="adminTab" class="hidden">管理</a>
        </nav>
      </div>
      <div class="controls">
        <span id="userLabel" class="user-label"></span>
        <button id="logoutBtn">登出</button>
      </div>
    </header>

    <main class="admin">
      <section class="admin-panel">
        <h2>偵測攝影機</h2>
        <p class="user-note">
          不確定某台相機支不支援即時串流（RTSP）？輸入它的 IP，系統會實際去測，
          並嘗試直接向相機詢問它的串流網址。
        </p>
        <form id="probeForm" class="admin-form">
          <label>相機 IP <input id="probeHost" type="text" placeholder="例如：192.168.213.38" required /></label>
          <label>帳號 <input id="probeUser" type="text" value="admin" /></label>
          <label>密碼 <input id="probePass" type="text" placeholder="相機密碼（沒有可留空）" /></label>
          <button type="submit" id="probeBtn">🔍 開始偵測</button>
        </form>
        <div id="probeResult" class="probe-result"></div>
      </section>

      <section class="admin-panel">
        <h2>新增攝影機</h2>
        <form id="addCamForm" class="admin-form">
          <label>名稱 <input id="camName" type="text" placeholder="例如：大門" required /></label>
          <label>
            RTSP 網址
            <input id="camUrl" type="text" placeholder="rtsp://帳號:密碼@192.168.x.x:554/..." required />
          </label>
          <label class="chk" id="camRecordLabel"><input id="camRecord" type="checkbox" checked /> 同時錄影存檔</label>
          <label class="chk"><input id="camOnDemand" type="checkbox" /> 省電模式（點擊喚醒才連線，適合電池門鈴）</label>
          <button type="submit">➕ 新增攝影機</button>
          <p id="addCamErr" class="login-err hidden"></p>
        </form>
      </section>

      <section class="admin-panel">
        <h2>攝影機清單 <span id="camCount" class="count-badge">0</span></h2>
        <div id="camList" class="user-list"></div>
      </section>
    </main>

    <script src="/harden.js"></script>
    <script src="/cameras.js"></script>
  </body>
</html>
