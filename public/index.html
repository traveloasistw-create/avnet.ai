<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>監視器看板</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>📷 旅遊綠洲 監視器看板</h1>
        <nav class="tabs">
          <a href="/" class="active">即時</a>
          <a href="/playback.html" id="playbackTab">回放</a>
          <a href="/cameras.html" id="camMgmtTab" class="hidden">攝影機</a>
          <a href="/admin.html" id="adminTab" class="hidden">管理</a>
        </nav>
      </div>
      <div class="controls">
        <label class="cols-control">
          版面
          <select id="layoutSelect">
            <option value="auto" selected>自動網格</option>
            <option value="cols-2">網格 2 欄</option>
            <option value="cols-3">網格 3 欄</option>
            <option value="cols-4">網格 4 欄</option>
            <option value="spotlight">聚焦（1 大 + 其餘）</option>
            <option value="film">重點 + 縮圖列</option>
            <option value="corridor">走廊直式</option>
            <option value="sequence">輪播切換</option>
          </select>
        </label>
        <button id="fullscreenBtn" title="全螢幕">⛶ 全螢幕</button>
        <span id="offlineAlert" class="offline-alert hidden"></span>
        <span id="userLabel" class="user-label"></span>
        <button id="logoutBtn">登出</button>
      </div>
    </header>

    <main id="grid" class="grid"></main>

    <div id="empty" class="empty hidden">
      <p>目前沒有可檢視的攝影機。</p>
      <p>可能是尚未設定攝影機，或你的帳號還沒有被授權任何一支。</p>
    </div>

    <script src="/vendor/hls.js/hls.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
