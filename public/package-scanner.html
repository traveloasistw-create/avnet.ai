<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 包货扫码时间记录系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-complete {
            background: #2196F3;
            color: white;
        }

        .btn-complete:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-export {
            background: #FF9800;
            color: white;
        }

        .btn-export:hover {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-clear {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-clear:hover {
            background: #da190b;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .records-container {
            grid-column: 1 / -1;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table thead {
            background: #f5f5f5;
            position: sticky;
            top: 0;
        }

        table th {
            padding: 12px;
            text-align: left;
            color: #555;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .status-start {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-complete {
            background: #bbdefb;
            color: #1565c0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .duration {
            color: #667eea;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .success-message {
            background: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .records-container {
                grid-column: 1;
            }

            header h1 {
                font-size: 1.8em;
            }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.95em;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 包货扫码时间记录系统</h1>
            <p>实时记录包货时间戳，对照监视器快速验证</p>
        </header>

        <div class="main-content">
            <!-- 左侧：输入区域 -->
            <div class="card">
                <h2>🔍 扫码输入</h2>

                <div class="info-box">
                    💡 扫码枪扫QR码 → 自动记录寄件号和时间
                </div>

                <div id="successMessage"></div>

                <div class="input-group">
                    <label for="waybillNumber">寄件编号 (Tracking Number)</label>
                    <input type="text" id="waybillNumber" placeholder="例如: tw2627552652668z" autofocus>
                </div>

                <div class="input-group">
                    <label for="status">包货状态</label>
                    <select id="status">
                        <option value="">-- 选择状态 --</option>
                        <option value="start">📍 开始包货</option>
                        <option value="complete">✓ 完成包货</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-start" onclick="recordStart()">开始 (F1)</button>
                    <button class="btn-complete" onclick="recordComplete()">完成 (F2)</button>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="number" id="totalRecords">0</div>
                        <div class="label">总扫描次数</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="pairsCount">0</div>
                        <div class="label">完成对数</div>
                    </div>
                </div>

                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                    <button class="btn-export" onclick="exportToExcel()" style="width: 100%; margin-bottom: 10px;">
                        📥 导出 Excel
                    </button>
                    <button class="btn-clear" onclick="clearAllData()" style="width: 100%;">
                        🗑️ 清空所有数据
                    </button>
                </div>
            </div>

            <!-- 右侧：统计和搜索 -->
            <div class="card">
                <h2>📊 快速查询</h2>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索寄件号...">
                    <button onclick="searchRecords()">搜索</button>
                </div>

                <div style="margin-bottom: 15px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                    <div style="margin-bottom: 10px;">
                        <strong>📈 今日统计</strong>
                    </div>
                    <div style="font-size: 0.95em; color: #666; line-height: 1.8;">
                        <div>已开始: <span id="startCount">0</span> 件</div>
                        <div>已完成: <span id="completeCount">0</span> 件</div>
                        <div>平均耗时: <span id="avgDuration">-</span></div>
                        <div>最长耗时: <span id="maxDuration">-</span></div>
                        <div>最短耗时: <span id="minDuration">-</span></div>
                    </div>
                </div>

                <div style="margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #FF9800;">
                    <strong style="color: #e65100;">⚡ 快捷键</strong>
                    <div style="font-size: 0.9em; color: #666; margin-top: 10px; line-height: 1.8;">
                        <div><code>F1</code> = 开始包货</div>
                        <div><code>F2</code> = 完成包货</div>
                        <div><code>Ctrl+E</code> = 导出Excel</div>
                    </div>
                </div>
            </div>

            <!-- 完整记录表 -->
            <div class="card records-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="margin: 0;">📋 扫码记录</h2>
                    <span style="color: #999; font-size: 0.9em;" id="recordCount">共 0 条记录</span>
                </div>

                <div id="recordsTable"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 数据管理 ====================
        const STORAGE_KEY = 'packageScannerData';
        const PAIRS_STORAGE_KEY = 'packageScannerPairs';

        // 初始化
        function initApp() {
            loadAndDisplayRecords();
            setupKeyboardShortcuts();
            document.getElementById('waybillNumber').focus();
        }

        // 快捷键
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F1') {
                    e.preventDefault();
                    recordStart();
                }
                if (e.key === 'F2') {
                    e.preventDefault();
                    recordComplete();
                }
                if (e.ctrlKey && e.key === 'e') {
                    e.preventDefault();
                    exportToExcel();
                }
            });
        }

        // 获取所有记录
        function getAllRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存记录
        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            loadAndDisplayRecords();
        }

        // 添加记录
        function addRecord(waybill, status) {
            const records = getAllRecords();
            const timestamp = new Date();

            records.push({
                id: Date.now(),
                waybill: waybill.trim(),
                status: status,
                timestamp: timestamp.toISOString(),
                timeDisplay: formatTime(timestamp)
            });

            saveRecords(records);
            showSuccessMessage(`✓ 已记录: ${waybill} (${status === 'start' ? '开始' : '完成'})`);
            clearInput();
        }

        // 清除输入
        function clearInput() {
            document.getElementById('waybillNumber').value = '';
            document.getElementById('status').value = '';
            document.getElementById('waybillNumber').focus();
        }

        // 开始包货
        function recordStart() {
            const waybill = document.getElementById('waybillNumber').value.trim();
            if (!waybill) {
                alert('请扫描或输入寄件编号');
                return;
            }
            addRecord(waybill, 'start');
        }

        // 完成包货
        function recordComplete() {
            const waybill = document.getElementById('waybillNumber').value.trim();
            if (!waybill) {
                alert('请扫描或输入寄件编号');
                return;
            }
            addRecord(waybill, 'complete');
        }

        // 计算配对和耗时
        function calculatePairs() {
            const records = getAllRecords();
            const pairs = [];
            const waybillMap = {};

            // 按寄件号分组
            records.forEach(record => {
                if (!waybillMap[record.waybill]) {
                    waybillMap[record.waybill] = [];
                }
                waybillMap[record.waybill].push(record);
            });

            // 配对
            Object.keys(waybillMap).forEach(waybill => {
                const events = waybillMap[waybill];
                for (let i = 0; i < events.length - 1; i++) {
                    if (events[i].status === 'start' && events[i + 1].status === 'complete') {
                        const startTime = new Date(events[i].timestamp);
                        const completeTime = new Date(events[i + 1].timestamp);
                        const duration = (completeTime - startTime) / 1000; // 秒

                        pairs.push({
                            waybill: waybill,
                            startTime: startTime,
                            completeTime: completeTime,
                            duration: duration,
                            startDisplay: formatTime(startTime),
                            completeDisplay: formatTime(completeTime),
                            durationDisplay: formatDuration(duration)
                        });
                        i++; // 跳过已配对的
                    }
                }
            });

            return pairs;
        }

        // 格式化时间
        function formatTime(date) {
            if (!(date instanceof Date)) {
                date = new Date(date);
            }
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // 格式化耗时
        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}分${secs}秒`;
        }

        // 显示成功消息
        function showSuccessMessage(msg) {
            const msgDiv = document.getElementById('successMessage');
            msgDiv.innerHTML = `<div class="success-message">${msg}</div>`;
            setTimeout(() => {
                msgDiv.innerHTML = '';
            }, 3000);
        }

        // 加载并显示记录
        function loadAndDisplayRecords() {
            const records = getAllRecords();
            const pairs = calculatePairs();

            // 更新统计
            updateStats(records, pairs);

            // 显示记录表
            displayRecordsTable(records);
        }

        // 更新统计
        function updateStats(records, pairs) {
            const startCount = records.filter(r => r.status === 'start').length;
            const completeCount = records.filter(r => r.status === 'complete').length;

            document.getElementById('totalRecords').textContent = records.length;
            document.getElementById('pairsCount').textContent = pairs.length;
            document.getElementById('startCount').textContent = startCount;
            document.getElementById('completeCount').textContent = completeCount;

            if (pairs.length > 0) {
                const durations = pairs.map(p => p.duration);
                const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
                const maxDuration = Math.max(...durations);
                const minDuration = Math.min(...durations);

                document.getElementById('avgDuration').textContent = formatDuration(avgDuration);
                document.getElementById('maxDuration').textContent = formatDuration(maxDuration);
                document.getElementById('minDuration').textContent = formatDuration(minDuration);
            }
        }

        // 显示记录表
        function displayRecordsTable(records) {
            const tableDiv = document.getElementById('recordsTable');
            document.getElementById('recordCount').textContent = `共 ${records.length} 条记录`;

            if (records.length === 0) {
                tableDiv.innerHTML = '<div class="empty-state"><p>📭 还没有扫描记录</p><p style="font-size: 0.9em;">开始扫码后，记录会出现在这里</p></div>';
                return;
            }

            // 分组显示：相同寄件号的记录在一起
            const groupedByWaybill = {};
            records.forEach(record => {
                if (!groupedByWaybill[record.waybill]) {
                    groupedByWaybill[record.waybill] = [];
                }
                groupedByWaybill[record.waybill].push(record);
            });

            let html = '<table>';
            html += '<thead><tr>';
            html += '<th>寄件编号</th>';
            html += '<th>状态</th>';
            html += '<th>时间</th>';
            html += '<th>操作</th>';
            html += '</tr></thead><tbody>';

            // 反向显示（最新的在上面）
            const recordsReversed = [...records].reverse();
            recordsReversed.forEach(record => {
                const statusDisplay = record.status === 'start'
                    ? '<span class="status-start">开始</span>'
                    : '<span class="status-complete">完成</span>';
                html += `<tr>`;
                html += `<td><code>${record.waybill}</code></td>`;
                html += `<td>${statusDisplay}</td>`;
                html += `<td>${record.timeDisplay}</td>`;
                html += `<td><button class="btn-delete" onclick="deleteRecord(${record.id})">删除</button></td>`;
                html += `</tr>`;
            });

            html += '</tbody></table>';
            tableDiv.innerHTML = html;
        }

        // 删除记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                const records = getAllRecords();
                const filtered = records.filter(r => r.id !== id);
                saveRecords(filtered);
            }
        }

        // 搜索
        function searchRecords() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                loadAndDisplayRecords();
                return;
            }

            const records = getAllRecords().filter(r =>
                r.waybill.toLowerCase().includes(query)
            );

            document.getElementById('recordCount').textContent = `搜索结果: ${records.length} 条`;
            displayRecordsTable(records);
        }

        // 导出Excel
        function exportToExcel() {
            const pairs = calculatePairs();

            if (pairs.length === 0) {
                alert('没有完成的配对数据，无法导出');
                return;
            }

            // 准备数据
            const data = [
                ['寄件编号', '开始时间', '完成时间', '耗时(分秒)', '耗时(秒)'],
                ...pairs.map(p => [
                    p.waybill,
                    p.startDisplay,
                    p.completeDisplay,
                    p.durationDisplay,
                    Math.round(p.duration)
                ])
            ];

            // 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '包货记录');

            // 设置列宽
            ws['!cols'] = [
                { wch: 20 },
                { wch: 15 },
                { wch: 15 },
                { wch: 12 },
                { wch: 10 }
            ];

            // 保存
            const fileName = `包货记录_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);

            showSuccessMessage(`✓ 已导出 ${pairs.length} 条记录`);
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('⚠️ 确定要清空所有数据吗？此操作无法撤销！')) {
                if (confirm('再确认一次？所有扫码记录都会被删除！')) {
                    localStorage.removeItem(STORAGE_KEY);
                    loadAndDisplayRecords();
                    showSuccessMessage('✓ 所有数据已清空');
                }
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
