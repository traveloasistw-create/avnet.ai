<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標籤依儲位排序</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --line: #e3e6eb; --accent: #2563eb; --warn-bg: #fff4e5; --warn: #b54708;
    --err-bg: #fdecec; --err: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  label.file { display: block; margin-bottom: 12px; }
  label.file b { display: block; margin-bottom: 4px; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 12px; white-space: pre-line; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: 10px 12px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); }
  tr.guess td { background: var(--warn-bg); }
  tr.none td { background: var(--err-bg); }
</style>
</head>
<body>
<main>
  <h1>標籤依儲位排序</h1>
  <p class="sub">選擇出貨標籤 PDF 和庫存盤點 Excel，程式會依照每張標籤商品在 Excel 裡的「儲位」重新排列頁面，
    輸出「原檔名 衣櫥.pdf」。同一儲位內依選項貨號排，找不到儲位的放最後。</p>

  <div class="card">
    <label class="file"><b>1. 標籤 PDF</b><input type="file" id="pdfFile" accept=".pdf"></label>
    <label class="file"><b>2. 庫存盤點 Excel</b><input type="file" id="xlsxFile" accept=".xlsx,.xls,.csv"></label>
    <button id="run" disabled>排序並下載</button>
    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" hidden>
    <b>排序結果</b>
    <p class="sub" style="margin:4px 0 8px">黃色 = 規格文字對不上，用最相近的商品推測，請確認；紅色 = 找不到，排在最後。</p>
    <div class="table-wrap"><table id="result"></table></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const $ = (id) => document.getElementById(id);
const norm = (s) => String(s ?? '').replace(/\s+/g, '');
const collator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });

// ---------- 讀 PDF：每頁取出文字行 ----------
async function readLabels(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
  const labels = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const { items } = await page.getTextContent();
    // 依 y 座標分行（由上而下），同一行內依 x 排
    const rows = [];
    for (const it of items) {
      if (!it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find((r) => Math.abs(r.y - y) < 2);
      if (!row) rows.push(row = { y, parts: [] });
      row.parts.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    const lines = rows.map((r) => r.parts.sort((a, b) => a.x - b.x).map((q) => q.s).join('').trim());
    // 標籤格式：0 商品ID_ / 1 規格ID / 2 商品名 / 3 規格[貨號 / 4 物流單號 / 5 ...
    labels.push({ page: p - 1, name: lines[2] || '', spec: lines[3] || '', track: lines[4] || '' });
  }
  return labels;
}

// ---------- 讀 Excel：找出需要的欄位 ----------
function readStock(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  for (const sn of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' });
    const h = aoa.findIndex((r, i) => i < 10 && r.some((c) => norm(c) === '儲位'));
    if (h < 0) continue;
    const head = aoa[h].map(norm);
    const col = (name) => head.indexOf(name);
    const c = { name: col('系統商品名'), sku: col('選項貨號'), loc: col('儲位'), realLoc: col('實際儲位'),
                s1: col('規格一'), s2: col('規格二') };
    if (c.sku < 0 || c.s1 < 0) continue;
    return aoa.slice(h + 1).filter((r) => norm(r[c.sku])).map((r) => {
      const s2 = norm(r[c.s2]);
      const spec = norm(r[c.s1]) + (s2 && s2 !== '-' ? ',' + s2 : '');
      return {
        name: norm(r[c.name]), sku: norm(r[c.sku]), spec1: norm(r[c.s1]), spec,
        full: `${spec}[${norm(r[c.sku])}]`,
        loc: norm(c.realLoc >= 0 && norm(r[c.realLoc]) ? r[c.realLoc] : r[c.loc]),
      };
    });
  }
  throw new Error('Excel 裡找不到含「儲位」「選項貨號」「規格一」欄位的工作表');
}

// ---------- 比對：標籤 → Excel 列 ----------
function bigrams(s) { const a = []; for (let i = 0; i < s.length - 1; i++) a.push(s.slice(i, i + 2)); return a; }
function similarity(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (!A.length || !B.length) return 0;
  const pool = [...B]; let hit = 0;
  for (const g of A) { const k = pool.indexOf(g); if (k >= 0) { hit++; pool.splice(k, 1); } }
  return (2 * hit) / (A.length + B.length);
}

function match(label, stock) {
  const name = norm(label.name), spec = norm(label.spec);
  const byName = stock.filter((r) => name && r.name.startsWith(name));
  // 1) 標籤文字是「規格[貨號」被截斷的開頭
  const prefixOf = (pool) => pool.find((r) => r.full.startsWith(spec));
  // 2) 標籤文字比 Excel 多了註記，例如「皮革護照包-米白【無法客製…」
  const extended = (pool, minLen) => pool
    .filter((r) => r.spec1.length >= minLen && spec.startsWith(r.spec1))
    .sort((a, b) => b.spec1.length - a.spec1.length)[0];
  // 先找同名商品，找不到再找整份 Excel（標籤商品名有時和 Excel 的系統商品名不同）；
  // 整份找時規格至少 5 個字，避免「黑色」這種短規格亂配
  const row = prefixOf(byName) || extended(byName, 1) || prefixOf(stock) || extended(stock, 5);
  if (row) return { row, how: 'exact' };
  // 3) 推測：同商品裡規格文字最像的一個
  if (!byName.length) return { row: null, how: 'none' };
  const skuPart = (spec.match(/\[([A-Za-z0-9]+)$/) || [])[1] || '';
  const bare = spec.replace(/\[[^\]]*$/, '');
  let best = null, bestScore = 0;
  for (const r of byName) {
    const score = similarity(bare, r.spec) + (skuPart.length >= 3 && r.sku.startsWith(skuPart) ? 1 : 0);
    if (score > bestScore) { best = r; bestScore = score; }
  }
  return bestScore >= 0.3 ? { row: best, how: 'guess' } : { row: null, how: 'none' };
}

function sortLabels(labels, stock) {
  const out = labels.map((l) => ({ ...l, ...match(l, stock) }));
  const loc = (x) => x.row?.loc || '';
  out.sort((a, b) =>
    (!loc(a) - !loc(b)) ||                       // 沒儲位的放最後
    collator.compare(loc(a), loc(b)) ||          // 儲位 A0 < A3 < B1 < … < X < X1 < Z
    collator.compare(a.row?.sku || '', b.row?.sku || '') ||
    a.page - b.page);                            // 其餘維持原本順序
  return out;
}

// ---------- 輸出 PDF ----------
async function buildPdf(buf, order) {
  const src = await PDFLib.PDFDocument.load(buf);
  const dst = await PDFLib.PDFDocument.create();
  const pages = await dst.copyPages(src, order.map((l) => l.page));
  pages.forEach((p) => dst.addPage(p));
  return dst.save();
}

function download(bytes, filename) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function showResult(order) {
  const rows = order.map((l, i) => `<tr class="${l.how === 'exact' ? '' : l.how}">
      <td>${i + 1}</td><td>${l.page + 1}</td><td>${esc(l.row?.loc || '—')}</td><td>${esc(l.row?.sku || '—')}</td>
      <td>${esc(l.spec)}</td><td>${esc(l.track)}</td></tr>`).join('');
  $('result').innerHTML = `<tr><th>新順序</th><th>原頁</th><th>儲位</th><th>選項貨號</th><th>標籤規格</th><th>物流單號</th></tr>${rows}`;
  $('resultCard').hidden = false;
}

// ---------- 介面 ----------
const ready = () => { $('run').disabled = !($('pdfFile').files[0] && $('xlsxFile').files[0]); };
$('pdfFile').onchange = ready; $('xlsxFile').onchange = ready;

$('run').onclick = async () => {
  const status = $('status');
  $('run').disabled = true; status.className = ''; status.textContent = '處理中…';
  try {
    const pdfFile = $('pdfFile').files[0];
    const pdfBuf = await pdfFile.arrayBuffer();
    const stock = readStock(await $('xlsxFile').files[0].arrayBuffer());
    const labels = await readLabels(pdfBuf);
    const order = sortLabels(labels, stock);
    const bytes = await buildPdf(pdfBuf, order);
    const outName = pdfFile.name.replace(/\.pdf$/i, '') + ' 衣櫥.pdf';
    download(bytes, outName);
    showResult(order);

    const guess = order.filter((l) => l.how === 'guess'), none = order.filter((l) => l.how === 'none');
    let msg = `完成：共 ${order.length} 張標籤，已下載「${outName}」。`;
    if (guess.length) msg += `\n${guess.length} 張是推測儲位（表格黃色），請確認。`;
    if (none.length) msg += `\n${none.length} 張找不到儲位，排在最後（表格紅色）。`;
    status.className = guess.length || none.length ? 'warn' : '';
    status.textContent = msg;
  } catch (e) {
    console.error(e);
    status.className = 'err';
    status.textContent = '發生錯誤：' + e.message;
  } finally { ready(); }
};
</script>
</body>
</html>
